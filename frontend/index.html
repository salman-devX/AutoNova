<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoNova — Car Service Center Management System</title>
    <meta name="description" content="Premium car service center management platform — book appointments, track service status live, and manage vehicles, invoices, and history in one dashboard." />

    <script>
      // Applied before React mounts so there's no flash of the wrong theme on load.
      try {
        var t = localStorage.getItem('autonova_theme');
        if (t === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
